[mod-setting-description]
sushi-splitters-and-more-tweaks-recipe-hints=Enables recipe hints for the sushi splitters, which shows a small icon in the upper left corner if the sushi splitter recipe requires a splitter or sushi splitter as ingredient. Useful when exporting to Foreman and such to differentiate between the two recipes.
